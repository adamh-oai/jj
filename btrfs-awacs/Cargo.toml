[package]
name = "btrfs-awacs"
version = "0.1.0"
edition = { workspace = true }
autobins = false
description = "Btrfs snapshot change index with immutable direct-scan integration"
license = "MIT"

[[bin]]
name = "awacs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
getrandom = "0.3.3"
libc = "0.2.189"
linux-raw-sys = { version = "0.9.4", features = ["general"] }
rusqlite = "0.34.0"
sha2 = "0.10.9"
uuid = { version = "1.18.0", features = ["v4"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3.19.1"
