syntax = "proto3";

package local_working_copy;

message SparsePatterns {
  repeated string prefixes = 1;
}

message TreeState {
  bytes legacy_tree_id = 1 [deprecated = true];
  // Alternating positive and negative terms if there's a conflict, otherwise a
  // single (positive) value
  repeated bytes tree_ids = 5;
  // Labels for the terms of a conflict.
  repeated string conflict_labels = 7;
  // Legacy per-path file states are intentionally not decoded. Reserving the
  // field numbers makes old payloads metadata-only migrations: protobuf skips
  // the row bytes while retaining the semantic tree and sparse metadata.
  reserved 2, 6;
  SparsePatterns sparse_patterns = 3;
  // Legacy Watchman-only cursor. Read for migration, but new state is written
  // to fsmonitor_cursor instead.
  WatchmanClock watchman_clock = 4 [deprecated = true];
  FsmonitorCursor fsmonitor_cursor = 8;
}

message WatchmanClock {
  oneof watchman_clock {
    string string_clock = 1;
    int64 unix_timestamp = 2;
  }
}

message FsmonitorCursor {
  reserved 2;
  oneof cursor {
    WatchmanClock watchman = 1;
  }
}

message Checkout {
  // The operation at which the working copy was updated.
  bytes operation_id = 2;
  // An identifier for this workspace. It is used for looking up the current
  // working-copy commit in the repo view. Currently a human-readable name.
  // TODO: Is it better to make this a UUID and a have map that to a name in
  // config? That way users can rename a workspace.
  string workspace_name = 3;
  reserved 1;
}

// Compact durable state for a local working copy. This replaces the legacy
// split checkout/tree_state files. It intentionally contains no per-path file
// state: the semantic tree is paired with an optional authoritative filesystem
// baseline instead.
message WorkingCopyState {
  uint32 format_version = 1;
  // The operation at which the working copy was updated.
  bytes operation_id = 2;
  // The workspace name used to look up the working-copy commit in the view.
  string workspace_name = 3;
  // Alternating positive and negative terms if there's a conflict, otherwise a
  // single positive value.
  repeated bytes tree_ids = 4;
  repeated string conflict_labels = 5;
  SparsePatterns sparse_patterns = 6;
  // Present only for Watchman-style mutable-filesystem monitors. AWACS
  // baselines are typed snapshot state below, not event-stream cursors.
  FsmonitorCursor fsmonitor_cursor = 7;
  uint64 generation = 8;
  WorkingCopyStatePhase phase = 9;
  // The intended semantic tree during an interrupted materialization. These
  // are populated only for PendingMaterialization.
  repeated bytes pending_tree_ids = 10;
  repeated string pending_conflict_labels = 11;
  // Exact AWACS snapshot paired with the semantic tree for CleanBaseline.
  // This is absent for NoBaseline and ordinary mutable-filesystem scans.
  AwacsSnapshotBaseline baseline = 12;
  // Candidate retained snapshot while a baseline promotion is in flight.
  AwacsSnapshotBaseline pending_baseline = 13;
  bytes transition_id = 14;
  string no_baseline_reason = 15;
  string mutation_kind = 16;
  repeated string pending_sparse_patterns = 17;
}

message AwacsSnapshotBaseline {
  // Identity of the exact immutable Btrfs snapshot paired with the tree.
  bytes filesystem_uuid = 1;
  bytes subvolume_uuid = 2;
  // Authenticated AWACS capability proving continuity from this snapshot.
  bytes continuity_token = 3;
  // Non-empty only once AWACS exposes a durable client-owned retention pin.
  bytes retention_token = 4;
  // JJ-owned inputs which affect interpretation of the snapshot contents.
  bytes interpretation_input_fingerprint = 5;
}

enum WorkingCopyStatePhase {
  NoBaseline = 0;
  CleanBaseline = 1;
  PendingMaterialization = 2;
  PendingBaselineCommit = 3;
}
