[package]
name = "jj-lib"
description = "Library for Jujutsu - an experimental version control system"
autotests = false

version.workspace = true
license.workspace = true
rust-version.workspace = true
edition.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true

include = [
    "/LICENSE",
    "/src/",
    "/tests/",
    "!*.pending-snap",
    "!*.snap*",
]

[[test]]
name = "runner"

[dependencies]
async-trait = { workspace = true }
blake2 = { workspace = true }
bstr = { workspace = true }
chrono = { workspace = true }
clru = { workspace = true }
digest = { workspace = true }
dunce = { workspace = true }
either = { workspace = true }
futures = { workspace = true }
filetime = { version = "0.2.29", optional = true }
gix-index-cache = { package = "gix-index", git = "https://github.com/adamh-oai/gitoxide", rev = "ae185e5cdccd23f3cabeea83609d978f5a05b95c", optional = true, features = ["sha1", "sha256"] }
gix-hash-cache = { package = "gix-hash", git = "https://github.com/adamh-oai/gitoxide", rev = "ae185e5cdccd23f3cabeea83609d978f5a05b95c", optional = true, features = ["sha1", "sha256"] }
gix-object-cache = { package = "gix-object", git = "https://github.com/adamh-oai/gitoxide", rev = "ae185e5cdccd23f3cabeea83609d978f5a05b95c", optional = true }
gix-validate-cache = { package = "gix-validate", git = "https://github.com/adamh-oai/gitoxide", rev = "ae185e5cdccd23f3cabeea83609d978f5a05b95c", optional = true }
gix = { workspace = true, optional = true }
gix-ignore = { workspace = true }
globset = { workspace = true }
indexmap = { workspace = true }
interim = { workspace = true }
itertools = { workspace = true }
jj-core = { workspace = true }
maplit = { workspace = true }
memchr = { workspace = true }
once_cell = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
pollster = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
ref-cast = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
strsim = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
watchman_client = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
eyre = { workspace = true }
indoc = { workspace = true }
insta = { workspace = true }
num_cpus = { workspace = true }
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rustversion = { workspace = true }
serde_json = { workspace = true }
test-case = { workspace = true }
testutils = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = [ "fs" ] }

[features]
default = ["git"]
git = ["dep:gix", "dep:filetime", "dep:gix-index-cache", "dep:gix-hash-cache", "dep:gix-object-cache", "dep:gix-validate-cache"]
watchman = ["dep:watchman_client", "dep:tokio"]
awacs = ["dep:btrfs-awacs"]
testing = ["git"]

[target.'cfg(target_os = "linux")'.dependencies]
btrfs-awacs = { workspace = true, optional = true }

[lints]
workspace = true
